<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rides｜Rocky Rider Life</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
      background: #f7fbff;
      color: #333;
    }

    header {
      background: linear-gradient(135deg, #87ceeb, #c1f0dc);
      padding: 50px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 2rem;
    }

    main {
      max-width: 720px;
      margin: -40px auto 40px;
      padding: 0 20px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      margin-bottom: 20px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    .card img {
      width: 100%;
      display: block;
    }

    .card-content {
      padding: 16px;
    }

    .card-content h2 {
      margin: 0 0 8px;
      color: #4a90e2;
    }

    .card-content p {
      margin: 0;
    }
  </style>
</head>
<body>

<header>
  <h1>騎乘旅行 Rides</h1>
</header>

<main>
  <!-- 範例卡片，可複製新增 -->
  <main id="rides-container"></main>

<script>
fetch('data/posts.json')
  .then(res => res.json())
  .then(posts => {
    const container = document.getElementById('rides-container');
    posts.forEach(post => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${post.image}" alt="${post.title}">
        <div class="card-content">
          <h2>${post.title}</h2>
          <p>${post.date}｜${post.description}</p>
        </div>
      `;
      container.appendChild(card);
    });
  });
</script>

</main>

</body>
</html>
