<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rides｜Rocky Rider Life</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
      background: #f7fbff;
      color: #333;
    }

    header {
      background: linear-gradient(135deg, #87ceeb, #c1f0dc);
      padding: 50px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 2rem;
    }

    main {
      max-width: 720px;
      margin: -40px auto 40px;
      padding: 0 20px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      margin-bottom: 20px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    .card img {
      width: 100%;
      display: block;
    }

    .card-content {
      padding: 16px;
    }

    .card-content h2 {
      margin: 0 0 8px;
      color: #4a90e2;
    }

    .card-content p {
      margin: 0;
    }
  </style>
</head>
<body>

<header>
  <h1>騎乘旅行 Rides</h1>
</header>

<main>
  <!-- 範例卡片，可複製新增 -->
  <div class="card">
    <img src="https://via.placeholder.com/720x400?text=北海岸+一日騎旅" alt="北海岸一日騎旅">
    <div class="card-content">
      <h2>北海岸一日騎旅</h2>
      <p>2026-01-15｜分享當天騎乘心得與沿途風景…</p>
    </div>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/720x400?text=淡水河騎乘" alt="淡水河騎乘">
    <div class="card-content">
      <h2>淡水河騎乘</h2>
      <p>2026-01-20｜沿著河邊騎，享受微風和陽光。</p>
    </div>
  </div>

</main>

</body>
</html>
